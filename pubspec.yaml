name: oasis_housing
description: Oasis Housing property management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F2E9DD"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
